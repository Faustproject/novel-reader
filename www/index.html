<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小說閱讀器">
<meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#22201d" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>英文小說閱讀器</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2b2622; --muted:#7a7067; --line:#e2d9c8;
  --accent:#9a4a1f; --accent-ink:#fff; --hl:#ffe2a8; --shadow:0 8px 28px rgba(60,40,20,.18);
  --cur:#f3e7cd; --ok:#1f7a3d; --bad:#c0392b; --warn:#b26a00;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191715; --paper:#22201d; --ink:#e8e1d6; --muted:#9c9287; --line:#3a3530;
    --accent:#e0915c; --accent-ink:#1b1410; --hl:#6b4a1c; --shadow:0 8px 28px rgba(0,0,0,.5);
    --cur:#39311f; --ok:#6fcf8a; --bad:#ff8a7a; --warn:#f0b35a;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif}
header{
  position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line);
}
#title{flex:1 1 120px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:14px}
button,.btn{
  font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.2;
}
button:hover,.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
#pageInput{width:56px;font:inherit;font-size:14px;text-align:center;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
main{max-width:44rem;margin:0 auto;padding:28px 16px 80px}
#reader{font-family:Georgia,"Times New Roman",serif;line-height:1.75;font-size:19px}
#reader p{margin:0 0 1em}
#reader h2{font-size:1.3em;line-height:1.35;margin:1.2em 0 .7em}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--hl)}
.w.on{background:var(--hl);outline:1px solid var(--accent)}
#drop{
  border:2px dashed var(--line);border-radius:16px;padding:56px 20px;text-align:center;color:var(--muted);
  font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.8;
}
#drop.over{border-color:var(--accent);color:var(--ink)}
.note{color:var(--muted);font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;font-size:15px}
.foot{display:flex;justify-content:space-between;margin-top:32px}
/* 設定面板 */
#settings{
  position:fixed;top:52px;right:12px;z-index:20;width:260px;display:none;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;font-size:14px;
}
#settings.open{display:block}
#settings h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600}
#settings label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
#settings select{font:inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#settings input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
/* 字典卡 */
#card{
  position:absolute;z-index:10;display:none;width:min(360px,calc(100vw - 16px));max-height:min(60vh,440px);overflow:auto;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;font-size:14px;line-height:1.55;
}
#card .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#card .word{font-family:Georgia,serif;font-size:22px;font-weight:700}
#card .ipa{color:var(--muted)}
#card .spk{padding:3px 9px;border-radius:999px}
#card .zh{margin:8px 0 2px;font-size:16px}
#card .zh small,#card .src{color:var(--muted);font-size:12px}
#card .pos{margin:12px 0 4px;color:var(--accent);font-weight:600;font-style:italic}
#card ol{margin:0;padding-left:20px}
#card li{margin-bottom:6px}
#card .ex{color:var(--muted);font-style:italic}
#card .syn{color:var(--muted);font-size:13px;margin-top:2px}
#card .base{margin-top:8px}
#card a{color:var(--accent);cursor:pointer;text-decoration:underline}
#card .cardbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
/* 朗讀中的句子 */
.s.cur{background:var(--cur);border-radius:3px}
/* 跟讀練習 */
#practice{
  position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;background:var(--paper);
  border-top:1px solid var(--line);box-shadow:var(--shadow);padding:12px 16px 14px;
}
#practice.open{display:block}
#practice .in{max-width:44rem;margin:0 auto}
.ptop{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.ptop .sp{flex:1}
#pTarget{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.6;margin:6px 0;max-height:28vh;overflow:auto}
.pw{cursor:pointer;border-radius:3px}
.pw:hover{background:var(--hl)}
.pw.ok{color:var(--ok)}
.pw.bad{color:var(--bad);font-weight:700;text-decoration:underline wavy}
.pw.unsure{color:var(--warn);font-weight:700;text-decoration:underline dotted}
#pHeard{font-size:13px;color:var(--muted);min-height:1.5em}
.pbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
body.practising main{padding-bottom:320px}
/* ---------- iOS 補丁 ---------- */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;font-family:-apple-system,"PingFang TC","Segoe UI","Microsoft JhengHei",system-ui,sans-serif}
header{padding-top:calc(8px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right))}
main{padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));padding-bottom:calc(80px + env(safe-area-inset-bottom))}
#practice{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#settings{top:calc(52px + env(safe-area-inset-top))}
button,.btn,.w,.pw{touch-action:manipulation}
@media (pointer:coarse){
  button,.btn{padding:9px 13px;min-height:38px}
  #pageInput,#settings select{font-size:16px}          /* 低於 16px iOS 會在聚焦時自動放大畫面 */
  #pageInput{width:62px}
  #title{flex-basis:100%;order:9}
  #card{max-height:min(55vh,440px);-webkit-overflow-scrolling:touch}
}
@media (hover:none){
  .w:hover,.pw:hover{background:transparent}
  .w.on{background:var(--hl)}
  button:hover,.btn:hover{border-color:var(--line)}
  .primary:hover{border-color:var(--accent)}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;display:none;
  max-width:min(92vw,30rem);background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.5;box-shadow:var(--shadow)}
body.practising #toast{bottom:auto;top:calc(70px + env(safe-area-inset-top))}
#diag{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6;word-break:break-word}
#diagTest{margin-top:8px;width:100%}
</style>
</head>
<body>
<header>
  <label class="btn primary">開啟 PDF<input id="file" type="file" accept="application/pdf,.pdf" hidden></label>
  <span id="title">尚未開啟檔案</span>
  <span class="nav">
    <button id="prev" title="上一頁（←）" disabled>‹</button>
    <input id="pageInput" type="number" min="1" value="1" disabled>
    <span id="pageCount">/ –</span>
    <button id="next" title="下一頁（→）" disabled>›</button>
  </span>
  <button id="read" title="從目前的句子開始念給你聽" disabled>▶ 朗讀</button>
  <button id="prac" title="你念給它聽，標出沒念清楚的字" disabled>🎤 跟讀</button>
  <button id="smaller" title="縮小字體">A−</button>
  <button id="bigger" title="放大字體">A+</button>
  <button id="gear" title="設定">⚙ 設定</button>
</header>

<div id="settings">
  <h3>設定</h3>
  <label>點字時自動發音 <input id="optSpeak" type="checkbox"></label>
  <label>口音
    <select id="optAccent"><option value="us">美式</option><option value="uk">英式</option></select>
  </label>
  <label>語音 <select id="optVoice" style="max-width:150px"></select></label>
  <div id="voiceTip" style="display:none;color:var(--warn);font-size:12px;line-height:1.6;padding-bottom:6px"></div>
  <label>朗讀速度
    <select id="optRate"><option value="0.7">慢</option><option value="0.85">稍慢</option><option value="1">正常</option><option value="1.15">快</option></select>
  </label>
  <label>顯示中文翻譯 <input id="optZh" type="checkbox"></label>
  <label>跟讀時同時錄音 <input id="optRec" type="checkbox"></label>
  <button id="diagTest">🔊 測試語音</button>
  <div id="diag"></div>
</div>
<div id="toast"></div>

<main>
  <div id="reader">
    <div id="drop">按左上角「開啟 PDF」，從「檔案」選一本英文小說<br>開啟後點任何一個單字就會顯示字典並發音</div>
  </div>
</main>

<div id="card"></div>

<div id="practice">
  <div class="in">
    <div class="ptop"><span>跟讀練習</span><span id="pScore"></span><span class="sp"></span><button id="pClose" title="關閉">✕</button></div>
    <div id="pTarget"></div>
    <div id="pHeard"></div>
    <div class="pbtns">
      <button id="pDemo">🔊 聽示範</button>
      <button id="pMic" class="primary">🎤 開始念</button>
      <button id="pMine" title="播放剛才錄下的聲音，和示範對照" disabled>▶ 聽我念的</button>
      <button id="pPrev">‹ 上一句</button>
      <button id="pNext">下一句 ›</button>
    </div>
  </div>
</div>

<script src="vendor/pdf.min.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const WORKER = 'vendor/pdf.worker.min.js';
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const DICT = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
const TRANS = 'https://api.mymemory.translated.net/get?langpair=en|zh-TW&q=';

/* ---------- 設定 ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const settings = Object.assign({autoSpeak:true, accent:'us', zh:true, fontSize:19, rate:0.85, recWithSR: !IOS, voice:{}}, store.get('nr:settings', {}));
const APP_VERSION = '1.2';
const STANDALONE = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const diag = {tts: '未測'};
let toastTimer = 0;
function toast(msg, ms){ const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms || 6000); }
function saveSettings(){ store.set('nr:settings', settings); }
function applySettings(){
  $('optSpeak').checked = settings.autoSpeak;
  $('optAccent').value = settings.accent;
  $('optZh').checked = settings.zh;
  $('optRec').checked = !!settings.recWithSR;
  $('optRate').value = String(settings.rate);
  $('reader').style.fontSize = settings.fontSize + 'px';
}
$('optRate').onchange = e => { settings.rate = parseFloat(e.target.value) || 0.85; saveSettings(); };
$('optSpeak').onchange = e => { settings.autoSpeak = e.target.checked; saveSettings(); if(!settings.autoSpeak) stopSound(); };
$('optAccent').onchange = e => { settings.accent = e.target.value; saveSettings(); fillVoices(); };
$('optVoice').onchange = e => { settings.voice[settings.accent] = e.target.value; saveSettings(); fillVoices(); stopSound(); say('This is how I sound when I read to you.', settings.rate); };
$('optZh').onchange = e => { settings.zh = e.target.checked; saveSettings(); };
$('optRec').onchange = e => { settings.recWithSR = e.target.checked; saveSettings(); };
$('smaller').onclick = () => { settings.fontSize = Math.max(14, settings.fontSize - 1); saveSettings(); applySettings(); };
$('bigger').onclick = () => { settings.fontSize = Math.min(32, settings.fontSize + 1); saveSettings(); applySettings(); };
$('gear').onclick = e => {
  e.stopPropagation();
  const s = $('settings'), top = document.querySelector('header').getBoundingClientRect().bottom + 6;   // 開在工具列下方，不蓋住按鈕
  s.style.top = top + 'px'; s.style.maxHeight = 'calc(100vh - ' + (top + 12) + 'px)'; s.style.overflowY = 'auto';
  s.classList.toggle('open'); showDiag();
};
$('settings').onclick = e => e.stopPropagation();
applySettings();

/* ---------- PDF 載入 ---------- */
let pdf = null, pageNo = 1, fileKey = '', renderToken = 0;
const workerReady = (async () => {
  if(!window.pdfjsLib) return;
  try{
    const src = await (await fetch(WORKER)).text();
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([src], {type:'text/javascript'}));
  }catch(e){
    pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER;
  }
})();

async function openPdfData(buffer, name){
  hideCard();
  if(!window.pdfjsLib){ note('無法載入 PDF 元件，請重新開啟 App。'); return; }
  note('讀取中…');
  try{
    await workerReady;
    pdf = await pdfjsLib.getDocument({data: buffer}).promise;
  }catch(e){
    pdf = null; note('這個檔案打不開：' + (e && e.message || e)); return;
  }
  fileKey = 'nr:pos:' + name + ':' + buffer.byteLength;
  $('title').textContent = name;
  $('pageCount').textContent = '/ ' + pdf.numPages;
  $('pageInput').max = pdf.numPages;
  $('pageInput').disabled = false;
  $('read').disabled = false; $('prac').disabled = false;
  await showPage(Math.min(pdf.numPages, store.get(fileKey, 1)));
}
window.openPdfData = openPdfData;

function note(msg){ $('reader').innerHTML = ''; const d = document.createElement('p'); d.className = 'note'; d.textContent = msg; $('reader').appendChild(d); }

async function openFile(f){
  if(!f) return;
  if(!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf'){ note('請選擇 PDF 檔。'); return; }
  await openPdfData(await f.arrayBuffer(), f.name);
}
$('file').onchange = e => { openFile(e.target.files[0]); e.target.value = ''; };
document.addEventListener('dragover', e => { e.preventDefault(); const d = $('drop'); if(d) d.classList.add('over'); });
document.addEventListener('dragleave', () => { const d = $('drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e => { e.preventDefault(); openFile(e.dataTransfer.files[0]); });

/* ---------- 文字抽取：PDF 頁 → 段落 ---------- */
function median(a){ if(!a.length) return 0; const s = a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; }
function mode(a){ const m = new Map(); let best = 0, bn = 0; for(const v of a){ const n = (m.get(v)||0)+1; m.set(v,n); if(n>bn){bn=n;best=v;} } return best; }

async function pageParagraphs(n){
  const page = await pdf.getPage(n);
  const tc = await page.getTextContent();
  let lines = [], cur = null;
  for(const it of tc.items){
    if(typeof it.str !== 'string') continue;
    const x = it.transform[4], y = it.transform[5];
    const h = it.height || Math.abs(it.transform[3]) || (cur ? cur.h : 10);
    if(cur && Math.abs(y - cur.y) < Math.max(cur.h, h) * 0.5){
      if(it.str){
        if(x - cur.endX > h * 0.2 && !/\s$/.test(cur.text) && !/^\s/.test(it.str)) cur.text += ' ';
        cur.text += it.str; cur.endX = x + it.width; cur.h = Math.max(cur.h, h);
      }
    }else{
      if(!it.str.trim()) continue;
      cur = {x, y, h, text: it.str, endX: x + it.width};
      lines.push(cur);
    }
  }
  lines.forEach(l => l.text = l.text.replace(/\s+/g, ' ').trim());
  lines = lines.filter(l => l.text && !/^\d{1,4}$/.test(l.text));   // 去掉純頁碼
  if(!lines.length) return [];

  const left = mode(lines.map(l => Math.round(l.x)));
  const bodyH = median(lines.map(l => l.h));
  const gaps = [];
  for(let i = 1; i < lines.length; i++){ const d = lines[i-1].y - lines[i].y; if(d > 0) gaps.push(d); }
  const typical = median(gaps) || bodyH * 1.2;

  const paras = [];
  let p = null;
  lines.forEach((l, i) => {
    const heading = l.h > bodyH * 1.25;
    const d = i ? lines[i-1].y - l.y : 0;
    const indented = l.x - left > l.h * 0.8;
    const brk = !p || heading !== p.heading || d > typical * 1.5 || d < 0 || indented;
    if(brk){ p = {heading, text: l.text}; paras.push(p); }
    else if(/[A-Za-z]-$/.test(p.text) && /^[a-z]/.test(l.text)) p.text = p.text.slice(0, -1) + l.text; // 行尾斷字接回
    else p.text += ' ' + l.text;
  });
  return paras;
}

/* ---------- 顯示 ---------- */
const WORD = /[A-Za-z]+(?:['’\-][A-Za-z]+)*/g;
function fillWords(el, text){
  let last = 0, m;
  WORD.lastIndex = 0;
  while((m = WORD.exec(text))){
    if(m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
    const s = document.createElement('span'); s.className = 'w'; s.textContent = m[0]; el.appendChild(s);
    last = m.index + m[0].length;
  }
  if(last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}

/* 段落 → 句子（朗讀與跟讀以句為單位） */
const ABBR = /(?:\b(?:Mr|Mrs|Ms|Dr|St|Prof|Sr|Jr|Capt|Col|Gen|Lt|Sgt|Rev|Hon|vs|etc|No)\.|\b[A-Z]\.)\s*$/;
function splitSentences(text){
  const parts = text.match(/[^.!?…]+(?:[.!?…]+["”’')\]]*\s*|$)|[.!?…]+\s*/g) || [text];
  const out = [];
  for(const p of parts){
    // 縮寫（Mr.）、沒有字母的片段、引號後接小寫（"Where?" she asked.）都併回前一句
    if(out.length && (ABBR.test(out[out.length-1]) || !/[A-Za-z]/.test(p) || /^[a-z]/.test(p))) out[out.length-1] += p;
    else out.push(p);
  }
  return out;
}
let sentences = [];   // 目前這一頁的句子：{el, text}

async function showPage(n, opts){
  if(!pdf) return;
  n = Math.max(1, Math.min(pdf.numPages, n|0 || 1));
  const token = ++renderToken;
  if(!(opts && opts.fromReader)) stopReading();
  closePractice();
  hideCard();
  let paras;
  try{ paras = await pageParagraphs(n); }
  catch(e){ if(token === renderToken) note('第 ' + n + ' 頁讀取失敗：' + (e && e.message || e)); return; }
  if(token !== renderToken) return;
  pageNo = n; store.set(fileKey, n);
  $('pageInput').value = n;
  $('prev').disabled = n <= 1; $('next').disabled = n >= pdf.numPages;
  const r = $('reader'); r.innerHTML = '';
  if(!paras.length){
    const d = document.createElement('p'); d.className = 'note';
    d.textContent = '這一頁沒有可讀取的文字（可能是空白頁、插圖，或整本是掃描圖檔）。';
    r.appendChild(d);
  }
  sentences = []; readIdx = 0;
  for(const p of paras){
    const el = document.createElement(p.heading ? 'h2' : 'p');
    for(const t of splitSentences(p.text)){
      if(!/[A-Za-z]/.test(t)){ el.appendChild(document.createTextNode(t)); continue; }
      const s = document.createElement('span'); s.className = 's'; s.dataset.i = sentences.length;
      fillWords(s, t); el.appendChild(s);
      sentences.push({el: s, text: t.trim()});
    }
    r.appendChild(el);
  }
  const foot = document.createElement('div'); foot.className = 'foot';
  const b1 = document.createElement('button'); b1.textContent = '‹ 上一頁'; b1.disabled = n <= 1; b1.onclick = () => showPage(pageNo - 1);
  const b2 = document.createElement('button'); b2.textContent = '下一頁 ›'; b2.disabled = n >= pdf.numPages; b2.onclick = () => showPage(pageNo + 1);

/* ---------- 字典 ---------- */
const dictCache = new Map(), zhCache = new Map();
function candidates(w){
  const c = [w];
  const add = v => { if(v.length >= 2 && !c.includes(v)) c.push(v); };
  if(w.includes('-')) add(w.replace(/-/g, ''));
  if(/ies$/.test(w)) add(w.slice(0,-3) + 'y');
  if(/es$/.test(w)) add(w.slice(0,-2));
  if(/s$/.test(w)) add(w.slice(0,-1));
  if(/ied$/.test(w)) add(w.slice(0,-3) + 'y');
  if(/ed$/.test(w)){ add(w.slice(0,-2)); add(w.slice(0,-1)); if(/(.)\1ed$/.test(w)) add(w.slice(0,-3)); }
  if(/ing$/.test(w)){ add(w.slice(0,-3)); add(w.slice(0,-3) + 'e'); if(/(.)\1ing$/.test(w)) add(w.slice(0,-4)); }
  if(/ly$/.test(w)) add(w.slice(0,-2));
  if(/est$/.test(w)) add(w.slice(0,-3));
  if(/er$/.test(w)) add(w.slice(0,-2));
  return c;
}
async function fetchEntry(w){
  if(dictCache.has(w)) return dictCache.get(w);
  const r = await fetch(DICT + encodeURIComponent(w));
  let v = null;
  if(r.ok) v = await r.json();
  else if(r.status !== 404) throw new Error('字典服務回應 ' + r.status);
  dictCache.set(w, v);
  return v;
}
async function lookup(w){
  for(const c of candidates(w)){ const v = await fetchEntry(c); if(v && v.length) return {found: c, entries: v}; }
  return null;
}
async function translate(w){
  if(zhCache.has(w)) return zhCache.get(w);
  const r = await fetch(TRANS + encodeURIComponent(w));
  if(!r.ok) throw new Error(r.status);
  const j = await r.json();
  const t = j && j.responseData && j.responseData.translatedText || '';
  const v = t && t.toLowerCase() !== w ? t : '';
  zhCache.set(w, v);
  return v;
}

/* 語音品質：Premium（高品質）> Enhanced（優化）> 基本（機械音）。搞怪語音一律排除 */
const JUNK = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/i;

/* 以最長共同子序列對齊「原句的字」與「聽到的字」，回傳原句每個字是否被聽到 */
function lcsMatch(a, b){
  const n = a.length, m = b.length, dp = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const at = new Array(n).fill(-1);               // 原句第 i 個字對到聽到的第幾個字（-1＝沒聽到）
  let i = 0, j = 0;
  while(i < n && j < m){
    if(a[i] === b[j]){ at[i] = j; i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++;
  }
  return at;
}
/* 嚴格評分：只採辨識引擎的第一聽法；對到但該段辨識信心低的字標為「不太確定」 */
const UNSURE_BELOW = 0.8;

  for(const f of finals) for(const w of f.text.split(/\s+/)){ const k = norm(w); if(k) heard.push({key: k, conf: f.conf}); }
  const at = lcsMatch(pTokens.map(t => t.key), heard.map(h => h.key));
  let ok = 0, unsure = 0, bad = 0;
  pTokens.forEach((t, i) => {
    const h = at[i] >= 0 ? heard[at[i]] : null;
    const st = !h ? 'bad' : (h.conf > 0 && h.conf < UNSURE_BELOW) ? 'unsure' : 'ok';
    t.el.classList.remove('ok', 'bad', 'unsure'); t.el.classList.add(st);

  const avg = confs.length ? Math.round(confs.reduce((a, b) => a + b, 0) / confs.length * 100) : 0;
  $('pScore').textContent = '聽清楚 ' + ok + ' / ' + pTokens.length + ' 個字' + (avg ? '　辨識信心 ' + avg + '%' : '');

  if(bad) tips.push('紅色＝沒聽到或聽成別的字');
  if(unsure) tips.push('橘色＝聽得出來但不夠清楚');
  $('pHeard').textContent = '聽到：' + finals.map(f => f.text).join(' ').trim() + '　— ' + (tips.length
    ? tips.join('；') + '。點那個字聽正確發音，再用「聽我念的」和示範對照。'

}

const card = $('card');
let activeEl = null, lookupToken = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function hideCard(){
  card.style.display = 'none';
  if(activeEl){ activeEl.classList.remove('on'); activeEl = null; }
  lookupToken++;
}
function placeCard(){
  if(!activeEl) return;
  card.style.display = 'block';
  const r = activeEl.getBoundingClientRect(), cw = card.offsetWidth, ch = card.offsetHeight;
  const left = Math.max(8, Math.min(r.left, window.innerWidth - cw - 8));
  let top = r.bottom + 8;
  if(top + ch > window.innerHeight - 8 && r.top - 8 - ch > 8) top = r.top - 8 - ch;
  card.style.left = (left + window.scrollX) + 'px';
  card.style.top = (top + window.scrollY) + 'px';
}

async function showWord(raw, el){
  const w = raw.toLowerCase().replace(/’/g, "'").replace(/'s$/, '');
  if(el){
    if(activeEl) activeEl.classList.remove('on');
    activeEl = el; el.classList.add('on');
  }
  const token = ++lookupToken;
  card.innerHTML = '<div class="head"><span class="word">' + esc(w) + '</span></div><div class="src">查詢中…</div>';
  placeCard();

  let res = null, err = '';
  try{ res = await lookup(w); }catch(e){ err = '字典查詢失敗（請檢查網路）。'; }
  if(token !== lookupToken) return;

  const entries = res ? res.entries : [];
  const shown = res ? res.found : w;
  const phonetics = [].concat(...entries.map(e => e.phonetics || []));
  const ipa = (entries.find(e => e.phonetic) || {}).phonetic || (phonetics.find(p => p.text) || {}).text || '';

  let html = '<div class="head"><span class="word">' + esc(shown) + '</span>' +
    (ipa ? '<span class="ipa">' + esc(ipa) + '</span>' : '') +
    '<button class="spk" data-act="speak" title="發音">🔊</button></div>';
  if(shown !== w) html += '<div class="src">原文：' + esc(w) + '</div>';
  if(settings.zh) html += '<div class="zh" id="zhLine"><small>中文翻譯載入中…</small></div>';
  if(err) html += '<div class="src">' + err + '</div>';
  else if(!res) html += '<div class="src">字典裡找不到這個字（可能是人名、地名或罕見拼法）。</div>';

  const bases = [];
  const byPos = new Map();
  for(const e of entries) for(const m of (e.meanings || [])){
    if(!byPos.has(m.partOfSpeech)) byPos.set(m.partOfSpeech, {defs: [], syn: []});
    const g = byPos.get(m.partOfSpeech);
    g.defs.push(...(m.definitions || []));
    g.syn.push(...(m.synonyms || []));
  }
  for(const [pos, g] of byPos){
    html += '<div class="pos">' + esc(pos || '') + '</div><ol>';
    for(const d of g.defs.slice(0, 3)){
      html += '<li>' + esc(d.definition) + (d.example ? '<div class="ex">例：' + esc(d.example) + '</div>' : '') + '</li>';
      const b = /\b(?:of|form of)\s+([a-z]+)\.?$/i.exec(d.definition);
      if(b && /(past|plural|participle|third-person|form|comparative|superlative)/i.test(d.definition)){
        const base = b[1].toLowerCase();
        if(base !== shown && !bases.includes(base)) bases.push(base);
      }
    }
    html += '</ol>';
    const syn = [...new Set(g.syn)].slice(0, 5);
    if(syn.length) html += '<div class="syn">同義：' + syn.map(esc).join('、') + '</div>';
  }
  if(bases.length) html += '<div class="base">原形：' + bases.map(b => '<a data-act="base" data-w="' + esc(b) + '">' + esc(b) + '</a>').join('、') + '</div>';

  if(activeEl && activeEl.closest('.s'))
    html += '<div class="cardbtns"><button data-act="readFrom">🔊 從這句開始朗讀</button><button data-act="practice">🎤 跟讀這一句</button></div>';

  card.innerHTML = html;
  card._word = shown; card._phonetics = phonetics;
  placeCard();
  if(settings.autoSpeak) speak(shown, phonetics);

  if(settings.zh){
    let zh = '';
    try{ zh = await translate(shown); }catch(e){}
    if(token !== lookupToken) return;
    const line = $('zhLine');
    if(line){
      if(zh) line.innerHTML = esc(zh) + ' <small>（機器翻譯，僅供參考）</small>';
      else line.remove();
      placeCard();
    }
  }
}
window.showWord = showWord;

card.addEventListener('click', e => {
  e.stopPropagation();
  const t = e.target.closest('[data-act]');
  if(!t) return;
  if(t.dataset.act === 'speak') speak(card._word, card._phonetics);
  if(t.dataset.act === 'base') showWord(t.dataset.w, null);
  if(t.dataset.act === 'readFrom' || t.dataset.act === 'practice'){
    const sEl = activeEl && activeEl.closest('.s'), i = sEl ? +sEl.dataset.i : 0;
    hideCard(); stopSound();
    if(t.dataset.act === 'readFrom'){ closePractice(); startReading(i); } else openPractice(i);
  }
});
$('reader').addEventListener('click', e => {
  if(e.target.classList && e.target.classList.contains('w')){
    e.stopPropagation();
    $('settings').classList.remove('open');
    if(e.target === activeEl){ hideCard(); return; }
    stopReading();
    showWord(e.target.textContent, e.target);
  }
});
document.addEventListener('click', () => { hideCard(); $('settings').classList.remove('open'); });
window.addEventListener('resize', placeCard);
})();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(hadSW && !reloaded){ reloaded = true; location.reload(); } });   // 有新版就自動換上
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {}));
}
</script>
</body>
</html>
